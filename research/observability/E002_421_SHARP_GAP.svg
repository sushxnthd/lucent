<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">E002-421: identical shutter averages, opposite hidden-closure truth</title>
<desc id="desc">Two boxcar exposures centered at 0 and 4.167 milliseconds have mean aperture 0.315 in both a constant trajectory and a V-shaped trajectory. The V-shaped trajectory reaches 0.190 below the 0.20 closure threshold. The old construction-specific ratio is below one despite ambiguity.</desc>
<rect width="960" height="540" fill="#ffffff"/>
<text x="90" y="47" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#182434">Two equal exposure averages do not exclude a hidden closure</text>
<text x="90" y="72" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#526173">E002-421 · analytic scalar aperture model · hypothetical V = 60 s⁻¹ · not human-calibrated</text>
