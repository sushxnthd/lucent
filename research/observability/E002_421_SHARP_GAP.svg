<text x="90" y="487" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#263c52">Both measured means = 0.315 · exact gap lower = m − Vd/2 = 0.190</text>
<text x="90" y="512" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#8d4520">Construction ratio R = 0.9565 &lt; 1, yet the closure remains observationally possible.</text>
