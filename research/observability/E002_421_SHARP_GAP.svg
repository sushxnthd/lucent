<text x="52" y="190">0.375</text><text x="52" y="250">0.315</text><text x="52" y="310">0.255</text><text x="52" y="365">0.200</text><text x="52" y="419">0.146</text>
<text x="84" y="432">−1</text><text x="190" y="432">0</text><text x="295" y="432">1</text><text x="400" y="432">2</text><text x="505" y="432">3</text><text x="629" y="432">4.17</text><text x="729" y="432">5.17</text>
