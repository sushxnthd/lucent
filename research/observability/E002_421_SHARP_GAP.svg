<line x1="90" y1="360" x2="738" y2="360" stroke="#b34040" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M90 245 L738 245" fill="none" stroke="#236b9d" stroke-width="3"/>
<path d="M90 185 L195 245 L300 305 L414 370 L528 305 L633 245 L738 185" fill="none" stroke="#ad6320" stroke-width="3.5"/>
<circle cx="414" cy="370" r="5" fill="#ad6320"/>
<text x="427" y="392" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#ad6320">min = 0.190</text>
