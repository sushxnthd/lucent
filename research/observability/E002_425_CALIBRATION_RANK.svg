<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">E002-425 finite-bin shutter calibration and timing mismatch</title>
<desc id="desc">Left: original grid pulse calibration has matrix rank 24 of 48, while randomized off-grid multiwidth calibration has rank 48 of 48. Right: simulated 30-microsecond pulse timing error produces shutter mass L1 error 0.787 despite a held-out response MAE of 0.00516. Synthetic results only.</desc>
<rect width="1120" height="560" fill="#fff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#171717">
<text x="48" y="50" font-size="24" font-weight="bold">E002-425  |  Excitation rank is not physical calibration</text>
<text x="48" y="78" font-size="14" fill="#555">Synthetic 48-bin shutter model · 2.4 ms exposure · frozen randomized pulse schedule</text>
<path d="M48 98H1072" stroke="#aaa" stroke-width="1"/>
<text x="48" y="136" font-size="18" font-weight="bold">A. Calibration matrix rank</text>
<text x="48" y="161" font-size="13" fill="#555">48 unknown bin masses; all observations are exact optical-pulse integrals</text>
<text x="48" y="213" font-size="15">Fixed 0.50 ms pulses, grid-aligned</text>
<rect x="48" y="229" width="454" height="32" fill="#ececec"/>
<rect x="48" y="229" width="227" height="32" fill="#9c5454"/>
<text x="515" y="252" font-size="16" font-weight="bold">24 / 48</text>
<text x="48" y="315" font-size="15">Off-grid 0.37 / 0.43 / 0.51 ms pulses</text>
<rect x="48" y="331" width="454" height="32" fill="#ececec"/>
<rect x="48" y="331" width="454" height="32" fill="#3f7470"/>
<text x="515" y="354" font-size="16" font-weight="bold">48 / 48</text>
<text x="48" y="399" font-size="13" fill="#555">Legacy uniform/alternating alias: &lt; 4×10⁻¹⁶ response difference</text>
<text x="48" y="422" font-size="13" fill="#555">Off-grid held-out maximum separation: 0.01943</text>
<path d="M614 118V458" stroke="#ddd" stroke-width="1"/>
<text x="654" y="136" font-size="18" font-weight="bold">B. Unmodeled pulse-start timing</text>
<text x="654" y="161" font-size="13" fill="#555">Same true kernel; nominal times used in reconstruction</text>
<text x="654" y="213" font-size="15">Kernel mass L1 error</text>
<rect x="654" y="232" width="315" height="35" fill="#ececec"/>
<rect x="654" y="232" width="4" height="35" fill="#3f7470"/>
<text x="977" y="246" font-size="13">0.00993</text>
<text x="654" y="287" font-size="13" fill="#555">Gaussian response noise, SD 0.0005</text>
<rect x="654" y="318" width="315" height="35" fill="#ececec"/>
<rect x="654" y="318" width="248" height="35" fill="#9c5454"/>
<text x="977" y="341" font-size="13">0.787</text>
<text x="654" y="377" font-size="13" fill="#555">Unmodeled pulse-start jitter, SD 0.03 ms</text>
<text x="654" y="422" font-size="13" fill="#555">Jittered fit still has held-out response MAE 0.00516</text>
<path d="M48 464H1072" stroke="#aaa" stroke-width="1"/>
<text x="48" y="497" font-size="14" font-weight="bold">Product consequence</text>
<text x="48" y="521" font-size="14">Rank and low residual cannot authenticate a physical shutter. Require photodiode timing and uncertainty sets.</text>
<text x="48" y="543" font-size="12" fill="#666">No camera or human measurements · E002-371 physically unvalidated · ABSTAIN_UNCALIBRATED</text>
</g>
</svg>
