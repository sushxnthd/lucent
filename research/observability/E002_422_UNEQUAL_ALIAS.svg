<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
<title id="title">E002-422: unequal exposure averages conceal a threshold crossing</title>
<desc id="desc">Two equal-duration shutters at 0 and 6 milliseconds average physical aperture 0.40 and 0.30. A V-shaped admissible trajectory touches the closure threshold 0.20 at 4 milliseconds while a distinct open trajectory has the same exposure means. A max-mean shortcut would falsely certify.</desc>
<rect width="1040" height="610" fill="#fff"/>
<text x="70" y="45" fill="#102333" font-family="Arial, sans-serif" font-size="26" font-weight="700">Unequal shutter means: the hidden-closure boundary</text>
<text x="70" y="74" fill="#425569" font-family="Arial, sans-serif" font-size="15">Exact boxcar means a = 0.40, b = 0.30   ·   V = 50 s⁻¹   ·   d = 6 ms   ·   E = 2 ms</text>
<rect x="80" y="122" width="200" height="332" fill="#dbeafe" opacity=".62"/>
<rect x="680" y="122" width="200" height="332" fill="#dbeafe" opacity=".62"/>
<text x="180" y="112" text-anchor="middle" fill="#245ea5" font-family="Arial, sans-serif" font-size="14">Shutter 1</text>
<text x="780" y="112" text-anchor="middle" fill="#245ea5" font-family="Arial, sans-serif" font-size="14">Shutter 2</text>
<line x1="80" y1="455" x2="904" y2="455" stroke="#263747" stroke-width="1.7"/>
<line x1="80" y1="122" x2="80" y2="455" stroke="#263747" stroke-width="1.7"/>
<g stroke="#e5eaf0" stroke-width="1">
<line x1="80" y1="160" x2="880" y2="160"/><line x1="80" y1="200" x2="880" y2="200"/>
<line x1="80" y1="280" x2="880" y2="280"/><line x1="80" y1="360" x2="880" y2="360"/>
</g>
<g font-family="Arial, sans-serif" font-size="14" fill="#425569" text-anchor="end">
<text x="66" y="165">0.45</text><text x="66" y="205">0.40</text><text x="66" y="285">0.30</text><text x="66" y="365">0.20</text>
</g>
<line x1="80" y1="360" x2="880" y2="360" stroke="#c44343" stroke-width="2" stroke-dasharray="7 6"/>
<text x="899" y="365" fill="#a52f32" font-family="Arial, sans-serif" font-size="13">θ = .20</text>
<polyline points="80,160 580,360 880,240" fill="none" stroke="#c44343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="80,200 280,200 680,280 880,280" fill="none" stroke="#188275" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="580" cy="360" r="6.5" fill="#c44343" stroke="#fff" stroke-width="2"/>
<text x="580" y="393" text-anchor="middle" fill="#9c2d30" font-family="Arial, sans-serif" font-size="14" font-weight="700">L = 0.20 at 4 ms</text>
<g stroke="#58718a" stroke-width="1.3">
<line x1="80" y1="455" x2="80" y2="462"/><line x1="180" y1="455" x2="180" y2="462"/>
<line x1="280" y1="455" x2="280" y2="462"/><line x1="580" y1="455" x2="580" y2="462"/>
<line x1="680" y1="455" x2="680" y2="462"/><line x1="780" y1="455" x2="780" y2="462"/>
<line x1="880" y1="455" x2="880" y2="462"/>
</g>
<g font-family="Arial, sans-serif" font-size="13" fill="#425569" text-anchor="middle">
<text x="80" y="481">−1</text><text x="180" y="481">0</text><text x="280" y="481">1</text>
<text x="580" y="481">4</text><text x="680" y="481">5</text><text x="780" y="481">6</text><text x="880" y="481">7</text>
</g>
<text x="480" y="512" font-family="Arial, sans-serif" fill="#263747" font-size="16" text-anchor="middle">Time (ms)</text>
<text x="20" y="290" font-family="Arial, sans-serif" fill="#263747" font-size="15" transform="rotate(-90 20 290)" text-anchor="middle">Normalized physical aperture</text>
<line x1="90" y1="540" x2="130" y2="540" stroke="#c44343" stroke-width="4"/><text x="139" y="545" fill="#33485c" font-family="Arial, sans-serif" font-size="14">V-valley: hidden threshold crossing</text>
<line x1="465" y1="540" x2="505" y2="540" stroke="#188275" stroke-width="4"/><text x="514" y="545" fill="#33485c" font-family="Arial, sans-serif" font-size="14">Always-open world: identical shutter means</text>
<text x="90" y="580" fill="#566c80" font-family="Arial, sans-serif" font-size="13">Illustrative conditional mathematics only. Human V, physical aperture transfer and shutter timing remain uncalibrated.</text>
</svg>
