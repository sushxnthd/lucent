<text x="333" y="493" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#566478">threshold crossing</text>
<text x="648" y="493" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#566478">threshold crossing</text>
<text x="87" y="398" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#566478">V = 60 s⁻¹</text>
<text x="87" y="419" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#566478">b = 1, c = 0.2</text>
