<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title desc">
<title id="title">E002-528 randomized-phase reference-camera witness sensitivity</title>
<desc id="desc">Exact conditional probability of a strictly fully contained reference exposure and probability of any positive overlap, versus closure duration divided by reference-camera period. Hypothetical 240 Hz, 1 ms exposure, 0.1 ms endpoint uncertainty. At duration 4 ms, strict full opportunity is 67.2 percent while positive overlap is 100 percent. These are not human measurements.</desc>
<rect width="900" height="510" fill="#ffffff"/>
<text x="95" y="40" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Reference-camera opportunity is not anatomical detection</text>
<text x="95" y="67" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Conditional uniform-phase model · 240 Hz · exposure 1 ms · endpoint uncertainty ±0.1 ms</text>
