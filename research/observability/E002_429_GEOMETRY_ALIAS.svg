<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
<title id="title">E002-429: two physical eyelid trajectories, identical projected measurements</title>
<desc id="desc">World A is always open at 2.04 millimeters. World B dips from 2.01 to 1.99 millimeters below the 2 millimeter threshold. Both have exactly the same projected signal under different effective angles. This is synthetic and not physiological validation.</desc>
<rect width="980" height="470" fill="#f8fafc"/>
