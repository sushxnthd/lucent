<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">E002-402: diagonal landmark separation can falsely exclude eyelid closure</title>
<desc id="desc">Left: upper and lower landmarks at the same vertical height but different image columns, yielding a nonzero diagonal distance despite zero vertical aperture. Right: the old method estimates normalized aperture 0.4, above the 0.2 threshold, while the corrected calibrated vertical measurement gives zero.</desc>
<rect width="1200" height="560" fill="#f8fafc"/>
