<line x1="296" y1="194" x2="296" y2="391" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 6"/>
<text x="296" y="185" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle">Calibrated x₀ = 70</text>
<line x1="210" y1="290" x2="382" y2="290" stroke="#d65b54" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 7"/>
<circle cx="210" cy="290" r="9" fill="#296e8c" stroke="white" stroke-width="3"/>
<circle cx="382" cy="290" r="9" fill="#b45347" stroke="white" stroke-width="3"/>
<text x="210" y="260" fill="#296e8c" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle">Upper (60,40)</text>
<text x="382" y="260" fill="#b45347" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle">Lower (80,40)</text>
<text x="296" y="318" fill="#b45347" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Euclidean distance = 20 px</text>
<text x="296" y="348" fill="#16785d" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Signed vertical gap at x₀ = 0 px</text>
<text x="64" y="428" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="13">Landmark columns differ; the 20 px horizontal</text>
<text x="64" y="448" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="13">separation is not a physical eyelid opening.</text>
