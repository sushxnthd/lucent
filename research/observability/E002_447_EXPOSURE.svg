<svg xmlns="http://www.w3.org/2000/svg" width="980" height="525" viewBox="0 0 980 525" role="img" aria-label="Two distinct Lipschitz aperture trajectories have the same 10 millisecond exposure average, but only one crosses the closure threshold.">
<rect width="980" height="525" fill="#fff"/>
<text x="70" y="39" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#14283c">Finite shutter integration hides a closure</text>
<text x="70" y="63" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#596879">E002-447 | idealized aperture sensor | synthetic assumptions, not human measurements</text>
<rect x="94" y="82" width="664" height="273" rx="2" fill="#f6f9fc"/>
<g stroke="#d9e1e8" stroke-width="1">
<path d="M100 126H750 M100 190H750 M100 222H750 M100 286H750 M100 350H750"/>
<path d="M100 80V355 M230 80V355 M360 80V355 M490 80V355 M620 80V355 M750 80V355"/>
</g>
<path d="M100 82V355H750" fill="none" stroke="#283c4e" stroke-width="1.8"/>
<path d="M100 222H750" stroke="#bd3946" stroke-width="2.5" stroke-dasharray="8 6"/>
<path d="M100 190H750" stroke="#0b8791" stroke-width="4"/>
<path d="M100 94 L165 132.4 L230 170.8 L295 209.2 L360 247.6 L425 286 L490 247.6 L555 209.2 L620 170.8 L685 132.4 L750 94" fill="none" stroke="#e28b2b" stroke-width="4" stroke-linejoin="round"/>
<circle cx="425" cy="286" r="6" fill="#e28b2b" stroke="#fff" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#4c5a68">
<text x="62" y="130">3.4</text><text x="62" y="194">3.0</text><text x="62" y="226">2.8</text><text x="62" y="290">2.4</text><text x="62" y="354">2.0</text>
<text x="91" y="375">-5</text><text x="222" y="375">-3</text><text x="356" y="375">-1</text><text x="421" y="375">0</text><text x="486" y="375">1</text><text x="616" y="375">3</text><text x="746" y="375">5</text>
<text x="377" y="403" font-size="14">Time relative to shutter center (ms)</text>
<text x="19" y="234" transform="rotate(-90 19 234)" font-size="14">Anatomical aperture (mm)</text>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-size="14">
<line x1="100" y1="429" x2="143" y2="429" stroke="#0b8791" stroke-width="4"/><text x="151" y="434" fill="#1f3347">Constant world: a(t) = 3.0</text>
<line x1="430" y1="429" x2="473" y2="429" stroke="#e28b2b" stroke-width="4"/><text x="481" y="434" fill="#1f3347">Hidden-closure world: 2.4 + 240|t|</text>
<line x1="100" y1="460" x2="143" y2="460" stroke="#bd3946" stroke-width="2.5" stroke-dasharray="8 6"/><text x="151" y="465" fill="#1f3347">Closure threshold: 2.8 mm</text>
</g>
<rect x="785" y="98" width="178" height="243" rx="8" fill="#edf4f8" stroke="#cad8e1"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1b3348">
<text x="802" y="123" font-size="13" font-weight="700">Same observed mean</text>
<text x="802" y="148" font-size="22" font-weight="700">3.0 mm</text>
<text x="802" y="177" font-size="12">10 ms boxcar shutter</text>
<path d="M802 191H947" stroke="#cad8e1"/>
<text x="802" y="214" font-size="12" font-weight="700">Sharp lower bound</text>
<text x="802" y="242" font-size="22" font-weight="700">2.4 mm</text>
<text x="802" y="265" font-size="12">3.0 - (240 x 0.010 / 4)</text>
<path d="M802 280H947" stroke="#cad8e1"/>
<text x="802" y="303" font-size="12" font-weight="700" fill="#ad343e">Point substitution fails</text>
<text x="802" y="324" font-size="11">Closure status not identified</text>
</g>
<text x="70" y="507" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#667687">No calibrated image-to-aperture map, physical shutter kernel or human velocity limit: product ABSTAIN_UNCALIBRATED.</text>
</svg>