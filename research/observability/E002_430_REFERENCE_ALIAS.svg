<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="Synthetic reference sampling alias at 400 Hz. Two worlds match at every observed reference sample, but one crosses the physical closure threshold between samples.">
<rect width="980" height="520" fill="#fcfdfd"/>
<text x="62" y="54" fill="#122235" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">High-rate reference sampling can still miss a closure</text>
<text x="62" y="81" fill="#546578" font-family="Arial,Helvetica,sans-serif" font-size="14">E002-430  ·  400 Hz reference  ·  synthetic physical aperture, not a human observation</text>
<rect x="105" y="117" width="745" height="288" rx="8" fill="#ffffff" stroke="#d5e0e8"/>
<g stroke="#e5ebef" stroke-width="1">
<line x1="105" y1="165" x2="850" y2="165"/><line x1="105" y1="213" x2="850" y2="213"/><line x1="105" y1="261" x2="850" y2="261"/><line x1="105" y1="309" x2="850" y2="309"/><line x1="105" y1="357" x2="850" y2="357"/>
</g>
<g fill="#5d6e7c" font-family="Arial,Helvetica,sans-serif" font-size="14">
<text x="54" y="170">2.20</text><text x="54" y="218">2.15</text><text x="54" y="266">2.10</text><text x="54" y="314">2.05</text><text x="54" y="362">2.00</text>
<text x="98" y="428">0.0</text><text x="465" y="428">1.25</text><text x="830" y="428">2.5</text>
<text x="421" y="464">Time within one 400-Hz interval (ms)</text>
<text transform="translate(24,322) rotate(-90)">Aperture (mm)</text>
</g>
<line x1="105" y1="357" x2="850" y2="357" stroke="#b42318" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="613" y="346" fill="#b42318" font-family="Arial,Helvetica,sans-serif" font-size="13">Closure threshold = 2.00 mm</text>
<line x1="105" y1="213" x2="850" y2="213" stroke="#1265a8" stroke-width="4" stroke-linecap="round"/>
<polyline points="105,213 477.5,405 850,213" fill="none" stroke="#c05621" stroke-width="4" stroke-linejoin="round"/>
<g fill="#1265a8" stroke="#ffffff" stroke-width="2"><circle cx="105" cy="213" r="8"/><circle cx="850" cy="213" r="8"/></g>
<line x1="477.5" y1="213" x2="477.5" y2="405" stroke="#c05621" stroke-width="1.5" stroke-dasharray="4 5" opacity=".55"/>
<text x="493" y="397" fill="#a64215" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">1.95 mm hidden minimum</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#293b4d">
<line x1="113" y1="487" x2="157" y2="487" stroke="#1265a8" stroke-width="4"/><text x="165" y="492">World A: always open</text>
<line x1="375" y1="487" x2="419" y2="487" stroke="#c05621" stroke-width="4"/><text x="427" y="492">World B: hidden closure</text>
<circle cx="692" cy="487" r="7" fill="#1265a8"/><text x="706" y="492">Identical observed samples</text>
</g>
<text x="863" y="180" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#657786">Sampled</text>
<text x="863" y="197" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#657786">aperture</text>
</svg>