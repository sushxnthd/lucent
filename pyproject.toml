[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lucent-research"
version = "0.1.0"
description = "Leakage-resistant evaluation utilities for the Lucent fatigue and cognitive-state research program."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "torchfile>=0.1.0",
  "pandas>=2.2",
  "requests>=2.31",
  "h5py>=3.10",
  "mat73-reader==0.1.0",
  "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
