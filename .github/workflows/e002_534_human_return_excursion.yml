name: E002-534 human image-return excursion (aggregate only)
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - "research/observability/E002_534_*"
      - "research/observability/e002_534_*"
      - "research/observability/test_e002_534_*"
      - ".github/workflows/e002_534_human_return_excursion.yml"
  workflow_dispatch:
jobs:
  synthetic-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Verify synthetic adversarial controls
        run: |
          python -m py_compile research/observability/e002_534_human_return_excursion.py
          python research/observability/test_e002_534_human_return_excursion.py -v
  real-human-native-image:
    needs: synthetic-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        participant: [S01, S19]
    steps:
      - uses: actions/checkout@v4
      - name: Install source parser dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Fetch checksum-verified public human recording (local only)
        env:
          PARTICIPANT: ${{ matrix.participant }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lucent-e002-534
          if [ "$PARTICIPANT" = "S01" ]; then
            URL='https://zenodo.org/records/18978288/files/S01.zip?download=1'
            MD5='fef02cb7ebf62e4f3efb6303284fd6cb'
          else
            URL='https://zenodo.org/records/21905748/files/S19.zip?download=1'
            MD5='8a16cf12526f7558b4e49926c4bc5e8e'
          fi
          curl --fail --location --retry 2 --retry-delay 8 --connect-timeout 45 --max-time 1400 \
            "$URL" --output "/tmp/lucent-e002-534/$PARTICIPANT.zip"
          echo "$MD5  /tmp/lucent-e002-534/$PARTICIPANT.zip" | md5sum --check
      - name: Execute preregistered native-image experiment; no images or linkage uploaded
        env:
          PARTICIPANT: ${{ matrix.participant }}
        run: |
          set -euo pipefail
          trap 'rm -rf /tmp/lucent-e002-534' EXIT
          python research/observability/e002_534_human_return_excursion.py \
            --archive "/tmp/lucent-e002-534/$PARTICIPANT.zip" \
            --participant "$PARTICIPANT"
          echo 'Only aggregate counts were printed. No human-image artifacts uploaded.'
