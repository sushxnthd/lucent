name: apst5-camera-robustness

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apst5-camera-robustness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run frozen camera-robust search
        run: python experiments/camera_robust_probe.py
      - name: Commit frozen result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/APST5_SIMULATION_005.md
          git commit -m "APST5-SIM-005: frozen camera-robust observability result [skip ci]" || exit 0
          git push origin HEAD:apst5-camera-robustness