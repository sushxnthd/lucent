name: pillai-public-browser-api

on:
  push:
    branches: ['pillai-drt-short-window']

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pillai-drt-short-window
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query anonymous browser public API
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          lines=['# Mendeley anonymous browser public API','']
          outputs={}
          for dataset in ['dp8g983t38','nmnfjry6vb']:
              base='https://data.mendeley.com/public-api/datasets/'+dataset
              folder_params=urllib.parse.urlencode({'version':'1','$start':'0','$limit':'1000'})
              folder_url=f'{base}/folders?{folder_params}'
              lines += [f'## {dataset} folders','',folder_url,'']
              folders=[]
              try:
                  req=urllib.request.Request(folder_url,headers={
                      'User-Agent':'Mozilla/5.0',
                      'Accept':'application/vnd.mendeley-public-dataset.1+json',
                  })
                  with urllib.request.urlopen(req,timeout=60) as response:
                      raw=response.read().decode('utf-8','replace')
                      lines.append(f'HTTP {response.status}; bytes={len(raw):,}')
                      folders=json.loads(raw)
                      outputs[dataset+'_folders']=folders
                      lines += ['', '~~~json', json.dumps(folders,indent=2)[:80000], '~~~','']
              except Exception as exc:
                  lines.append(f'Folder error {type(exc).__name__}: {exc}')
                  lines.append('')

              folder_ids=['root']
              if isinstance(folders,list):
                  folder_ids += [str(x.get('id')) for x in folders if x.get('id')]
              all_files=[]
              for folder_id in folder_ids:
                  params=urllib.parse.urlencode({'folder_id':folder_id,'version':'1','$start':'0','$limit':'1000'})
                  url=f'{base}/files?{params}'
                  lines += [f'### files folder={folder_id}','',url,'']
                  try:
                  req=urllib.request.Request(url,headers={
                      'User-Agent':'Mozilla/5.0',
                      'Accept':'application/vnd.mendeley-public-dataset.1+json',
                  })
                  with urllib.request.urlopen(req,timeout=60) as response:
                      raw=response.read().decode('utf-8','replace')
                      lines.append(f'HTTP {response.status}; bytes={len(raw):,}')
                      data=json.loads(raw)
                      if isinstance(data,list):
                          all_files.extend(data)
                      lines.append('')
                      lines.append(f'items: **{len(data) if isinstance(data,list) else "non-list"}**')
                      lines.append('')
                      lines.append('~~~json')
                      lines.append(json.dumps(data,indent=2)[:100000])
                      lines.append('~~~')
                  except urllib.error.HTTPError as exc:
                      body=exc.read().decode('utf-8','replace')
                      lines.append(f'HTTP error {exc.code}: {body[:20000]}')
                  except Exception as exc:
                      lines.append(f'Error {type(exc).__name__}: {exc}')
                  lines.append('')
              outputs[dataset+'_files']=all_files

          Path('results/PILLAI_PUBLIC_BROWSER_API.md').write_text('\n'.join(lines),encoding='utf-8')
          Path('results/PILLAI_PUBLIC_BROWSER_API.json').write_text(json.dumps(outputs,indent=2),encoding='utf-8')
          print('\n'.join(lines[:600]))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/PILLAI_PUBLIC_BROWSER_API.md results/PILLAI_PUBLIC_BROWSER_API.json
          git commit -m "Query Pillai anonymous Mendeley browser API [skip ci]" || exit 0
          git push origin HEAD:pillai-drt-short-window