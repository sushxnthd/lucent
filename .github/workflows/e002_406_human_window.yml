name: E002-406 frozen real-human full-event timing adequacy
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - "research/observability/E002_406_*"
      - "research/observability/e002_406_*"
      - ".github/workflows/e002_406_human_window.yml"
  workflow_dispatch:
jobs:
  full-event-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        participant: [S01, S19]
    steps:
      - uses: actions/checkout@v4
      - name: Install source parser dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Independent synthetic timing oracle
        run: python research/observability/e002_406_human_window_adequacy.py --self-test
      - name: Acquire checksum-verified real human synchronization
        env:
          PARTICIPANT: ${{ matrix.participant }}
        run: |
          mkdir -p /tmp/lucent-e002-406
          if [ "$PARTICIPANT" = "S01" ]; then
            URL='https://zenodo.org/records/18978288/files/S01.zip?download=1'
            MD5='fef02cb7ebf62e4f3efb6303284fd6cb'
          else
            URL='https://zenodo.org/records/21905748/files/S19.zip?download=1'
            MD5='8a16cf12526f7558b4e49926c4bc5e8e'
          fi
          curl --fail --location --retry 2 --retry-delay 8 --connect-timeout 45 --max-time 1400 \
            "$URL" --output "/tmp/lucent-e002-406/$PARTICIPANT.zip"
          echo "$MD5  /tmp/lucent-e002-406/$PARTICIPANT.zip" | md5sum --check
      - name: Test frozen human temporal-coverage predictions
        env:
          PARTICIPANT: ${{ matrix.participant }}
        run: |
          python research/observability/e002_406_human_window_adequacy.py \
            --archive "/tmp/lucent-e002-406/$PARTICIPANT.zip" \
            --participant "$PARTICIPANT" \
            --output "/tmp/lucent-e002-406/$PARTICIPANT-aggregate.json"
      - name: Upload aggregates only; never frames, EEG events or private mappings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e002-406-${{ matrix.participant }}-anonymous-temporal-coverage
          path: /tmp/lucent-e002-406/*-aggregate.json
          retention-days: 14
