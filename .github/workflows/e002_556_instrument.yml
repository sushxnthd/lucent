name: E002-556 instrument partition calibration
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - 'research/observability/e002_556_*'
      - 'research/observability/test_e002_556_*'
      - '.github/workflows/e002_556_instrument.yml'
  pull_request:
    paths:
      - 'research/observability/e002_556_*'
      - 'research/observability/test_e002_556_*'
      - '.github/workflows/e002_556_instrument.yml'
jobs:
  instrument-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic containment self-test
        run: node research/observability/e002_556_partition_calibration.cjs --self-test
      - name: Adversarial Node regression tests
        run: node research/observability/test_e002_556_partition_calibration.cjs
      - name: Independent Python direct-moment oracle
        run: python research/observability/e002_556_independent_oracle.py
