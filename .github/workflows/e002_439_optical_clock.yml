name: E002-439 optical clock instrument
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - 'research/observability/e002_439_optical_clock.py'
      - 'research/observability/test_e002_439_optical_clock.py'
      - 'research/observability/e002_490_codec_replay.py'
      - '.github/workflows/e002_439_optical_clock.yml'
  pull_request:
    paths:
      - 'research/observability/e002_439_optical_clock.py'
      - 'research/observability/test_e002_439_optical_clock.py'
      - 'research/observability/e002_490_codec_replay.py'
      - '.github/workflows/e002_439_optical_clock.yml'
  workflow_dispatch:
jobs:
  optical-clock-instrument:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provision and verify real FFmpeg and FFprobe binaries
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
      - name: Run adversarial tests including actual FFV1 encoder-decoder
        run: PYTHONPATH=research/observability python -m unittest -v research/observability/test_e002_439_optical_clock.py
      - name: Reproduce machine-readable experiment and assert hard abstention
        run: |
          python research/observability/e002_439_optical_clock.py --output /tmp/e002_439.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/e002_439.json'))
          assert x['identical_decoded_image_sha256'] is True
          assert x['rolling_shutter_splice_indistinguishable'] is True
          assert x['retimed_pts_ms'][-1] == 1000
          assert x['optical_ticks_after_retiming'][-1] == 500
          assert x['product'] == 'ABSTAIN_UNCALIBRATED'
          assert x['physical_exposure_authenticated'] is False
          print('E002-439 virtual instrument PASS; physical validation remains blocked')
          PY
      - name: Independently replay synthetic optical ticks against retimed FFV1 container
        shell: bash
        run: |
          set -euo pipefail
          python research/observability/e002_490_codec_replay.py > /tmp/e002_490.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/e002_490.json'))
          assert x['evidence_tier']=='INDEPENDENT_REAL_CODEC_SYNTHETIC_FRAMES'
          assert x['authored_frame_count']==12
          assert x['decoded_frames_identical_after_retime'] is True
          assert x['decoded_optical_ticks_match_authored'] is True
          assert abs(x['original_final_container_pts_ms']-500)<=1
          assert abs(x['retimed_final_container_pts_ms']-1000)<=1
          assert x['human_sequences']==0
          assert x['physical_exposure_authenticated'] is False
          assert x['product']=='ABSTAIN_UNCALIBRATED'
          print('Independent codec replay passed; physical/human validation remains blocked')
          PY
