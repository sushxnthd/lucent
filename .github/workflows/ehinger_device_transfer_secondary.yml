name: ehinger-device-transfer-secondary

on:
  push:
    branches: ['pspm-luminance-calibration']
    paths:
      - 'experiments/ehinger_device_transfer_secondary.py'
      - 'experiments/registrations/EHINGER_DEVICE_TRANSFER_001_SECONDARY.md'
      - '.github/workflows/ehinger_device_transfer_secondary.yml'

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pspm-luminance-calibration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - name: Download
        run: curl -L --fail --retry 3 -o /tmp/lum_binned.csv https://ndownloader.figshare.com/files/14184857
      - name: Run secondary specificity diagnostic
        run: python experiments/ehinger_device_transfer_secondary.py /tmp/lum_binned.csv --output results/EHINGER_DEVICE_TRANSFER_001_SECONDARY.md
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/EHINGER_DEVICE_TRANSFER_001_SECONDARY.md
          git commit -m 'EHINGER-DEVICE-TRANSFER-001: secondary specificity result [skip ci]' || exit 0
          git pull --rebase origin pspm-luminance-calibration
          git push origin HEAD:pspm-luminance-calibration