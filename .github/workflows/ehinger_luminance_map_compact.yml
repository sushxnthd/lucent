name: ehinger-luminance-map-compact

on:
  push:
    branches: ['pspm-luminance-calibration']
    paths:
      - '.github/workflows/ehinger_luminance_map_compact.yml'

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pspm-luminance-calibration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install scipy numpy
      - name: Extract only luminance randomization fields
        run: |
          curl -L --fail --retry 3 -o /tmp/random.mat https://raw.githubusercontent.com/behinger/etcomp/master/experiment_ehinger2019/data/stimuli_randomization.mat
          python - <<'PY'
          from scipy.io import loadmat
          from pathlib import Path
          import numpy as np
          d=loadmat('/tmp/random.mat',squeeze_me=True,struct_as_record=False)
          r=d['rand']
          lines=['# Ehinger luminance randomization — compact map','']
          for field in ['subject','block','pupildilation']:
              v=getattr(r,field)
              a=np.asarray(v,dtype=object)
              lines.append(f'## {field}')
              lines.append('')
              lines.append(f'type={type(v).__name__}; shape={a.shape}; dtype={a.dtype}')
              lines.append('')
              if field=='pupildilation':
                  lines.append('First 40 entries, preserving nested arrays:')
                  lines.append('~~~text')
                  for i,item in enumerate(a.reshape(-1)[:40]):
                      arr=np.asarray(item)
                      lines.append(f'{i}: shape={arr.shape} values={np.array2string(arr,threshold=200,max_line_width=180)}')
                  lines.append('~~~')
              else:
                  lines.append('~~~text')
                  lines.append(np.array2string(a,threshold=1000,max_line_width=180))
                  lines.append('~~~')
              lines.append('')
          Path('results/EHINGER_LUMINANCE_RANDOMIZATION_MAP.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/EHINGER_LUMINANCE_RANDOMIZATION_MAP.md
          git commit -m 'Map Ehinger luminance randomization fields [skip ci]' || exit 0
          git pull --rebase origin pspm-luminance-calibration
          git push origin HEAD:pspm-luminance-calibration