name: E002-381 moving-front shutter boundary
on:
  push:
    paths:
      - 'research/observability/e002_381_*.py'
      - '.github/workflows/e002_381_motion.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/observability/e002_381_exact.py
      - run: python research/observability/e002_381_independent.py
      - run: python research/observability/e002_381_certificate.py
