name: E002-164 temporal reference integrity
on:
  push:
    branches: [research/e002-164-waveform-label-lineage]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python research/e002-164/fold_audit.py
      - run: python research/e002-164/independent_check.py
      - run: python research/e002-164/wildcard_missingness.py
      - run: python research/e002-164/audit_public_csv.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e002-164-reference-integrity
          path: |
            research/e002-164/RESULTS.json
            research/e002-164/KAGGLE_PROBE.json
          if-no-files-found: warn
