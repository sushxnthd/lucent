name: mts-temporal-alignment-nuisance

on:
  push:
    branches: ['martin-pvt-replication']
    paths:
      - 'experiments/mts_temporal_alignment_nuisance.py'
      - 'experiments/registrations/MTS_TEMPORAL_ALIGNMENT_NUISANCE_001.md'
      - '.github/workflows/mts_temporal_alignment_nuisance.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: martin-pvt-replication

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run frozen nuisance audit
        run: python experiments/mts_temporal_alignment_nuisance.py

      - name: Commit frozen result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/MTS_TEMPORAL_ALIGNMENT_NUISANCE_001.md
          git commit -m "MTS-TEMPORAL-ALIGNMENT-NUISANCE-001: frozen audit result [skip ci]" || exit 0
          git push origin HEAD:martin-pvt-replication