name: research-ci

on:
  push:
    branches: ["main", "research-foundation", "apst5-breakthrough", "state-compression-breakthrough", "multimodal-compression", "correlated-multimodal", "adhd-temporal-locality"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Synthetic leakage smoke test
        run: python experiments/synthetic_identity_leakage.py
      - name: Run independent temporal-locality replication
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/adhd-temporal-locality'
        run: python experiments/adhd_realdata_temporal_locality.py
      - name: APST-5 active-probe reproduction
        if: github.ref != 'refs/heads/adhd-temporal-locality'
        run: python experiments/active_probe_design.py
      - name: APST-5 personalization-compression reproduction
        if: matrix.python-version == '3.12' && github.ref != 'refs/heads/adhd-temporal-locality'
        run: python experiments/personalization_compression.py
      - name: APST-5 multimodal-compression reproduction
        if: matrix.python-version == '3.12' && github.ref != 'refs/heads/adhd-temporal-locality'
        run: python experiments/multimodal_compression.py
      - name: APST-5 multimodal redundancy reproduction
        if: matrix.python-version == '3.12' && github.ref != 'refs/heads/adhd-temporal-locality'
        run: python experiments/multimodal_redundancy.py
