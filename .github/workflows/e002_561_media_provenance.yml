name: E002-561 real-media provenance falsification
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - '.github/workflows/e002_561_media_provenance.yml'
      - 'research/observability/e002_561_media_provenance.py'
      - 'research/observability/test_e002_561_media_provenance.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lucent-e002-561-media
  cancel-in-progress: false
jobs:
  ffv1-provenance:
    if: github.repository == 'sushxnthd/lucent'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify FFmpeg and FFprobe
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run synthetic lossless media adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          cd research/observability
          python -m unittest -v test_e002_561_media_provenance.py
      - name: Produce ephemeral structured scientific result
        shell: bash
        run: |
          set -euo pipefail
          python research/observability/e002_561_media_provenance.py > /tmp/e002_561_aggregate.json
          python -c 'import json; d=json.load(open("/tmp/e002_561_aggregate.json")); assert d["release"]=="BLOCKED" and d["low_rate_phases_missing_event"]==6; print("E002-561 synthetic instrument pass; no human evidence")'
      - name: Confirm no human media artifacts are uploaded
        run: echo 'All synthetic video files remain temporary; no human media were accessed.'
