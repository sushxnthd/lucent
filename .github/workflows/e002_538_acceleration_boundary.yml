name: E002-538 acceleration observability falsification
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - 'research/observability/e002_538_*'
      - 'research/observability/test_e002_538_*'
      - '.github/workflows/e002_538_acceleration_boundary.yml'
  workflow_dispatch:
jobs:
  exact-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-rational adversarial tests
        working-directory: research/observability
        run: python -m unittest -v test_e002_538_acceleration_boundary.py
      - name: Frozen exact-rational predictions
        working-directory: research/observability
        run: python e002_538_acceleration_boundary.py --frozen
      - name: Independent integer replay
        working-directory: research/observability
        run: node e002_538_independent_replay.cjs
