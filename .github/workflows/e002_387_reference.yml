name: E002-387 Reference Adequacy
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - 'research/observability/e002_387_reference_aliasing.py'
      - '.github/workflows/e002_387_reference.yml'
  pull_request:
    paths:
      - 'research/observability/e002_387_reference_aliasing.py'
      - '.github/workflows/e002_387_reference.yml'
  workflow_dispatch:
jobs:
  synthetic-reference-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic scientific dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Reproduce preregistered E002-387 phase sweep and independent quadrature
        run: python research/observability/e002_387_reference_aliasing.py
      - name: Preserve machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e002-387-reference-results
          path: research/observability/e002_387_results.json
          if-no-files-found: warn
