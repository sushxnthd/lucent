name: E002-411 shutter pulse identifiability falsification
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - 'research/observability/E002_411_*'
      - 'research/observability/e002_411_*'
      - 'research/observability/test_e002_411_*'
      - '.github/workflows/e002_411_phase_identifiability.yml'
  workflow_dispatch:
jobs:
  sparse-pulse-identifiability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute frozen analytic and randomized optical-instrument witnesses
        run: python research/observability/e002_411_phase_identifiability.py > e002_411_result.json
      - name: Execute independent numerical quadrature and gate oracle
        run: python research/observability/e002_411_independent_check.py
      - name: Run fail-closed release-gate regressions
        run: python -m unittest discover -s research/observability -p 'test_e002_411_phase_identifiability.py' -v
      - name: Preserve synthetic aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: e002-411-synthetic-instrument-results
          path: e002_411_result.json
          retention-days: 14
      - name: Scientific evidence warning
        run: |
          echo 'Synthetic optical-instrument inverse problem, not measured physical camera shutter response.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No human physical eyelid-aperture labels or deterministic velocity bound.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Product stays ABSTAIN_UNCALIBRATED.' >> "$GITHUB_STEP_SUMMARY"
