name: test-debug

on:
  push:
    branches: ['temporal-scale-audit']

permissions:
  contents: write

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temporal-scale-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Capture pytest output
        continue-on-error: true
        run: |
          mkdir -p results
          pytest -q > results/TEST_DEBUG.log 2>&1 || true
          cat results/TEST_DEBUG.log
      - name: Commit debug log
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/TEST_DEBUG.log
          git commit -m "Capture CI failure for temporal-scale audit [skip ci]" || exit 0
          git push origin HEAD:temporal-scale-audit