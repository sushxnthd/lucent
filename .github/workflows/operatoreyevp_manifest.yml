name: operatoreyevp-manifest

on:
  push:
    branches: ['operatoreyevp-external-validation']

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operatoreyevp-external-validation

      - name: Query public Yandex root
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          public_key='https://disk.yandex.ru/d/KmdoodhhveGZng'
          params=urllib.parse.urlencode({'public_key':public_key,'limit':'1000'})
          url='https://cloud-api.yandex.net/v1/disk/public/resources?'+params
          lines=['# OperatorEYEVP Yandex root inspection','',f'Endpoint: {url}','']
          try:
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 LucentResearch'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  body=response.read().decode('utf-8','replace')
                  lines.append(f'HTTP status: {response.status}')
                  lines.append('')
                  data=json.loads(body)
                  Path('results/OPERATOREYEVP_ROOT.json').write_text(json.dumps(data,indent=2),encoding='utf-8')
                  lines.append(f"Name: {data.get('name')}")
                  lines.append(f"Type: {data.get('type')}")
                  emb=data.get('_embedded') or {}
                  items=emb.get('items') or []
                  lines.append(f"Items returned: {len(items)} / total {emb.get('total')}")
                  lines.append('')
                  lines.append('## Root items')
                  for item in items:
                      lines.append(f"- {item.get('type')}: {item.get('name')} | path={item.get('path')} | size={item.get('size')}")
          except urllib.error.HTTPError as exc:
              body=exc.read().decode('utf-8','replace')
              lines.append(f'HTTP error: {exc.code}')
              lines.append('')
              lines.append(body[:10000])
          except Exception as exc:
              lines.append(f'Error: {type(exc).__name__}: {exc}')

          Path('results/OPERATOREYEVP_ROOT.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/OPERATOREYEVP_ROOT.md
          test ! -f results/OPERATOREYEVP_ROOT.json || git add results/OPERATOREYEVP_ROOT.json
          git commit -m "Inspect OperatorEYEVP Yandex root [skip ci]" || exit 0
          git push origin HEAD:operatoreyevp-external-validation