name: makowski-osf-manifest

on:
  push:
    branches: ['makowski-drowsiness-validation']

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: makowski-drowsiness-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install requests numpy pandas
      - name: Crawl public OSF project
        run: |
          python - <<'PY'
          import json, requests
          from collections import Counter, deque
          from pathlib import Path

          node='hmyc4'
          session=requests.Session()
          session.headers.update({'User-Agent':'lucent-research/1.0'})

          providers=session.get(f'https://api.osf.io/v2/nodes/{node}/files/',timeout=60).json()
          Path('results/MAKOWSKI_OSF_PROVIDERS.json').write_text(json.dumps(providers,indent=2),encoding='utf-8')
          rows=[]
          queue=deque()

          for item in providers.get('data',[]):
              attr=item.get('attributes') or {}
              rel=(
                  (((item.get('relationships') or {}).get('files') or {}).get('links') or {}).get('related') or {}
              ).get('href')
              if rel:
                  queue.append((attr.get('name') or item.get('id'), rel))

          seen=set()
          while queue:
              provider,url=queue.popleft()
              if url in seen: continue
              seen.add(url)
              while url:
                  data=session.get(url,timeout=60).json()
                  for item in data.get('data',[]):
                      attr=item.get('attributes') or {}
                      links=item.get('links') or {}
                      kind=attr.get('kind')
                      row={
                          'provider':provider,
                          'id':item.get('id'),
                          'name':attr.get('name'),
                          'kind':kind,
                          'path':attr.get('materialized_path'),
                          'size':attr.get('size'),
                          'date_modified':attr.get('date_modified'),
                          'download':links.get('download'),
                      }
                      rows.append(row)
                      if kind=='folder':
                          rel=(
                              (((item.get('relationships') or {}).get('files') or {}).get('links') or {}).get('related') or {}
                          ).get('href')
                          if not rel:
                              rel=links.get('new_folder')
                          if rel:
                              queue.append((provider,rel))
                  nxt=(data.get('links') or {}).get('next')
                  if isinstance(nxt,dict): nxt=nxt.get('href')
                  url=nxt

          files=[r for r in rows if r['kind']=='file']
          counts=Counter()
          for r in files:
              name=(r.get('name') or '').lower()
              suffix='.'+name.rsplit('.',1)[-1] if '.' in name else '<none>'
              counts[suffix]+=1

          lines=['# Makowski drowsiness OSF manifest','',f'OSF node: {node}',f'Resources: **{len(rows)}**',f'Files: **{len(files)}**',f'Listed bytes: **{sum(int(r.get("size") or 0) for r in files):,}**','']
          lines += ['## File types','','| suffix | count |','| --- | ---: |']
          for suffix,count in counts.most_common():
              lines.append(f'| {suffix} | {count} |')
          lines += ['','## Files','','| path | bytes | provider |','| --- | ---: | --- |']
          for r in sorted(files,key=lambda x:(x.get('path') or '',x.get('name') or ''))[:1000]:
              lines.append(f"| {r.get('path') or r.get('name')} | {int(r.get('size') or 0):,} | {r.get('provider')} |")

          Path('results/MAKOWSKI_OSF_MANIFEST.md').write_text('\n'.join(lines),encoding='utf-8')
          Path('results/MAKOWSKI_OSF_MANIFEST.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          print('\n'.join(lines[:300]))
          PY
      - name: Inspect Makowski metadata and labels
        run: |
          python - <<'PY'
          import io, json, urllib.request
          from pathlib import Path
          import numpy as np
          import pandas as pd

          urls={
              'README.txt':'https://osf.io/download/nqywk/',
              'data_format.json':'https://osf.io/download/ak5rt/',
              'label_format.json':'https://osf.io/download/e2mda/',
              'human_readable_featurenames.csv':'https://osf.io/download/pjn8b/',
              'label.npy':'https://osf.io/download/3zasd/',
              'session_type.npy':'https://osf.io/download/mq28f/',
              'sub_id.npy':'https://osf.io/download/67mux/',
          }

          blobs={}
          for name,url in urls.items():
              with urllib.request.urlopen(url,timeout=120) as response:
                  blobs[name]=response.read()

          readme=blobs['README.txt'].decode('utf-8','replace')
          data_format=json.loads(blobs['data_format.json'])
          label_format=json.loads(blobs['label_format.json'])
          features=pd.read_csv(io.BytesIO(blobs['human_readable_featurenames.csv']))
          labels=np.load(io.BytesIO(blobs['label.npy']),allow_pickle=False)
          session=np.load(io.BytesIO(blobs['session_type.npy']),allow_pickle=False)
          sub=np.load(io.BytesIO(blobs['sub_id.npy']),allow_pickle=False)

          lines=['# Makowski drowsiness metadata schema','']
          lines += ['## README','', '~~~text', readme, '~~~','']
          lines += ['## data_format.json','', '~~~json', json.dumps(data_format,indent=2), '~~~','']
          lines += ['## label_format.json','', '~~~json', json.dumps(label_format,indent=2), '~~~','']
          lines += ['## array shapes','','| array | shape | dtype | unique/sample |','| --- | --- | --- | --- |']
          def sample(a):
              flat=np.asarray(a).reshape(-1)
              vals=np.unique(flat[:min(len(flat),100000)])
              return str(vals[:30].tolist())
          lines.append(f'| label.npy | {labels.shape} | {labels.dtype} | {sample(labels)} |')
          lines.append(f'| session_type.npy | {session.shape} | {session.dtype} | {sample(session)} |')
          lines.append(f'| sub_id.npy | {sub.shape} | {sub.dtype} | {sample(sub)} |')
          lines += ['','## label preview','','    '+np.array2string(labels[:8],threshold=2000).replace('\n','\n    ')]
          lines += ['','## session/sub preview','','    session='+np.array2string(session[:40])+'','    sub='+np.array2string(sub[:40])+'']
          lines += ['','## human-readable feature names','','columns: '+', '.join(map(str,features.columns)),'','    '+features.head(80).to_csv(index=False).replace('\n','\n    ')]
          lines += ['','## participant/session counts','']
          lines.append(f'unique subjects: **{len(np.unique(sub))}**')
          lines.append(f'unique session types: **{np.unique(session).tolist()}**')
          pairs=set(zip(np.asarray(sub).reshape(-1).tolist(),np.asarray(session).reshape(-1).tolist()))
          lines.append(f'unique subject/session pairs: **{len(pairs)}**')

          Path('results/MAKOWSKI_SCHEMA.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:320]))
          PY

      - name: Commit manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/MAKOWSKI_OSF_MANIFEST.md results/MAKOWSKI_OSF_MANIFEST.json results/MAKOWSKI_OSF_PROVIDERS.json results/MAKOWSKI_SCHEMA.md
          git commit -m "Inspect public Makowski drowsiness OSF dataset [skip ci]" || exit 0
          git push origin HEAD:makowski-drowsiness-validation