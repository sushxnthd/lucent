name: E002-555 blinded human video annotation gate
on:
  push:
    branches:
      - research/observability-human-boundary
    paths:
      - 'research/observability/e002_555_*'
      - 'research/observability/test_e002_555_*'
      - '.github/workflows/e002_555_rater_audit.yml'
  pull_request:
    paths:
      - 'research/observability/e002_555_*'
      - 'research/observability/test_e002_555_*'
      - '.github/workflows/e002_555_rater_audit.yml'
jobs:
  fail-closed-annotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run adversarial rater audit
        run: python -m unittest discover -s research/observability -p 'test_e002_555_rater_audit.py' -v
      - name: Check offline UI JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('research/observability/e002_555_offline_rater.html').read_text()
          assert page.count('<script>') == page.count('</script>') == 1
          Path('/tmp/e002_555_ui.js').write_text(page.split('<script>')[1].split('</script>')[0])
          PY
          node --check /tmp/e002_555_ui.js
