name: E002-425 off-grid shutter identifiability
on:
  push:
    branches:
      - research/observability-human-boundary
    paths:
      - 'research/observability/E002_425_*'
      - 'research/observability/e002_425_*'
      - 'research/observability/test_e002_425_*'
      - '.github/workflows/e002_425_shutter_identification.yml'
  workflow_dispatch:
jobs:
  independent-finite-bin-instrument-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free scientific dependencies
        run: python -m pip install numpy scipy
      - name: Independently verify pulse quadrature, nullspace and recovery
        run: python -m unittest -v research/observability/test_e002_425_shutter_identification.py
      - name: Reproduce frozen synthetic aggregate and enforce physical abstention
        run: |
          python research/observability/e002_425_shutter_identification.py > e002_425_synthetic_result.json
          python - <<'PY'
          import json
          with open("e002_425_synthetic_result.json") as f:
              x = json.load(f)
          assert all(x["frozen_tests"].values()), x["frozen_tests"]
          assert not x["policy"]["product_claim_authorized"]
          assert x["policy"]["product"] == "ABSTAIN_UNCALIBRATED"
          print(json.dumps(x["frozen_tests"], indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e002-425-synthetic-only
          path: e002_425_synthetic_result.json
          retention-days: 7
