name: E002-571 measured-rater real-browser acceptance
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - '.github/workflows/e002_571_measured_rater_browser.yml'
      - 'research/observability/e002_571_measured_rater_browser.py'
      - 'research/observability/e002_557_browser_e2e.py'
      - 'research/observability/e002_497_offline_rater.html'
      - 'research/observability/e002_492_anatomical_review.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lucent-e002-571-browser
  cancel-in-progress: false
jobs:
  synthetic-measured-browser:
    if: github.repository == 'sushxnthd/lucent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned browser-test dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.56.0 pillow==12.0.0
      - name: Require real Chromium
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium
      - name: Exercise synthetic measured and abstained anatomical paths
        shell: bash
        run: |
          set -euo pipefail
          python research/observability/e002_571_measured_rater_browser.py
      - name: Confirm no media or annotation artifacts are uploaded
        run: echo 'Synthetic PNGs and exported JSON were confined to ephemeral temporary directories.'
