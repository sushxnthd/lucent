name: E002-294 Hidden-Dose Scientific Verification
on:
  push:
    branches:
      - research/e002-294-periodic-hidden-dose
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Reproduce theoretical/synthetic results
        working-directory: research/e002-294
        run: |
          python experiment.py
          python independent_checker.py
      - name: Verify exact rational collision and holdout gates
        working-directory: research/e002-294
        run: |
          python - <<'PY'
          import json
          a=json.load(open('verification.json'))
          assert a['status']=='passed'
          assert a['linear_program_cases']==100
          assert a['exact_rational_collisions']==2
          assert a['mutations_rejected']==3
          assert a['unseen_synthetic_holdout']=='passed'
          PY
