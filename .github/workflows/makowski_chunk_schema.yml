name: makowski-chunk-schema

on:
  push:
    branches: ['makowski-drowsiness-validation']

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: makowski-drowsiness-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install numpy
      - name: Download first chunk and source code
        run: |
          mkdir -p /tmp/makowski
          curl -L --fail --retry 3 -o /tmp/makowski/evaluation.py https://osf.io/download/5m7yr/
          curl -L --fail --retry 3 -o /tmp/makowski/run_evaluation.py https://osf.io/download/dx8t4/
          curl -L --fail --retry 3 -o /tmp/makowski/config.py https://osf.io/download/7bhnx/
          curl -L --fail --retry 3 -o /tmp/makowski/data_down_5_0.zip https://osf.io/download/jqau7/
          ls -lh /tmp/makowski/
      - name: Inspect
        run: |
          python - <<'PY'
          import shutil, zipfile
          from pathlib import Path
          import numpy as np

          root=Path('/tmp/makowski')
          lines=['# Makowski code + first-chunk schema','']
          for name in ['evaluation.py','run_evaluation.py','config.py']:
              text=(root/name).read_text(encoding='utf-8',errors='replace')
              lines += [f'## {name}','', '~~~python', text[:30000], '~~~','']

          zpath=root/'data_down_5_0.zip'
          lines += ['## first ZIP','','archive bytes: **'+f'{zpath.stat().st_size:,}'+'**','']
          with zipfile.ZipFile(zpath) as z:
              infos=z.infolist()
              lines.append('members:')
              for info in infos:
                  lines.append(f'- {info.filename}: compressed={info.compress_size:,}; uncompressed={info.file_size:,}')
              target=next((i for i in infos if i.filename.lower().endswith('.npy')),None)
              if target is None:
                  raise RuntimeError('No NPY in chunk ZIP; members='+str([i.filename for i in infos]))
              out=root/'chunk.npy'
              with z.open(target) as src, out.open('wb') as dst:
                  shutil.copyfileobj(src,dst,length=16*1024*1024)

          arr=np.load(root/'chunk.npy',mmap_mode='r')
          lines += ['','## NPY','','shape: **'+str(arr.shape)+'**','dtype: **'+str(arr.dtype)+'**','C contiguous: **'+str(arr.flags.c_contiguous)+'**','']
          lines += ['first sample, first two time steps:','','    '+np.array2string(np.asarray(arr[0,:2,:]),precision=4,threshold=2000).replace('\n','\n    '),'']
          lines += ['first sample, last two time steps:','','    '+np.array2string(np.asarray(arr[0,-2:,:]),precision=4,threshold=2000).replace('\n','\n    '),'']
          for duration in [2,3,5,15,60]:
              n=int(duration*200)
              tail=np.asarray(arr[:min(200,len(arr)),-n:,:])
              lines.append(f'{duration}s tail: shape={tail.shape}, finite={np.isfinite(tail).mean():.4%}, mean={np.nanmean(tail):.6g}, sd={np.nanstd(tail):.6g}')

          Path('results/MAKOWSKI_CHUNK_SCHEMA.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[-100:]))
          PY
      - name: Commit
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test ! -f results/MAKOWSKI_CHUNK_SCHEMA.md || git add results/MAKOWSKI_CHUNK_SCHEMA.md
          git commit -m "Inspect Makowski sequence chunk schema [skip ci]" || exit 0
          git push origin HEAD:makowski-drowsiness-validation