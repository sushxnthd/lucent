name: makowski-chunk-schema

on:
  push:
    branches: ['makowski-drowsiness-validation']

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: makowski-drowsiness-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install numpy requests
      - name: Inspect public code and first data chunk
        run: |
          python - <<'PY'
          import io, json, os, shutil, subprocess, urllib.request, zipfile
          from pathlib import Path
          import numpy as np

          code_urls={
            'evaluation.py':'https://osf.io/download/5m7yr/',
            'run_evaluation.py':'https://osf.io/download/dx8t4/',
            'config.py':'https://osf.io/download/7bhnx/',
          }
          lines=['# Makowski code + first-chunk schema','']
          for name,url in code_urls.items():
            with urllib.request.urlopen(url,timeout=120) as response:
              text=response.read().decode('utf-8','replace')
            lines += [f'## {name}','', '~~~python', text[:30000], '~~~','']

          zip_path=Path('/tmp/data_down_5_0.zip')
          urllib.request.urlretrieve('https://osf.io/download/jqau7/',zip_path)
          lines += ['## first ZIP','','archive bytes: **'+f'{zip_path.stat().st_size:,}'+'**','']
          with zipfile.ZipFile(zip_path) as z:
            infos=z.infolist()
            lines.append('members:')
            for info in infos:
              lines.append(f'- {info.filename}: compressed={info.compress_size:,}; uncompressed={info.file_size:,}')
            target=next((i for i in infos if i.filename.lower().endswith('.npy')),None)
            if target is None:
              raise RuntimeError('No NPY in chunk ZIP')
            out=Path('/tmp/chunk.npy')
            with z.open(target) as src, out.open('wb') as dst:
              shutil.copyfileobj(src,dst,length=16*1024*1024)

          arr=np.load('/tmp/chunk.npy',mmap_mode='r')
          lines += ['','## NPY','','shape: **'+str(arr.shape)+'**','dtype: **'+str(arr.dtype)+'**','C contiguous: **'+str(arr.flags.c_contiguous)+'**','']
          lines.append('first sample, first two time steps:')
          lines.append('')
          lines.append('    '+np.array2string(np.asarray(arr[0,:2,:]),precision=4,threshold=2000).replace('\n','\n    '))
          lines.append('')
          lines.append('first sample, last two time steps:')
          lines.append('')
          lines.append('    '+np.array2string(np.asarray(arr[0,-2:,:]),precision=4,threshold=2000).replace('\n','\n    '))
          lines.append('')
          for duration in [2,3,5,15,60]:
            n=int(duration*200)
            tail=np.asarray(arr[:min(200,len(arr)),-n:,:])
            finite=np.isfinite(tail)
            lines.append(f'{duration}s tail: shape={tail.shape}, finite={finite.mean():.4%}, mean={np.nanmean(tail):.6g}, sd={np.nanstd(tail):.6g}')

          Path('results/MAKOWSKI_CHUNK_SCHEMA.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[-80:]))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/MAKOWSKI_CHUNK_SCHEMA.md
          git commit -m "Inspect Makowski sequence chunk schema [skip ci]" || exit 0
          git push origin HEAD:makowski-drowsiness-validation