name: E002-603 private-answer challenge instrument
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - 'research/observability/e002_603_private_challenge.py'
      - 'research/observability/e002_602_public_answer_attack.py'
      - 'research/observability/e002_600_phantom_rater_challenge.py'
      - '.github/workflows/e002_603_private_challenge.yml'
  pull_request:
    paths:
      - 'research/observability/e002_603_private_challenge.py'
      - 'research/observability/e002_602_public_answer_attack.py'
      - 'research/observability/e002_600_phantom_rater_challenge.py'
      - '.github/workflows/e002_603_private_challenge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic image dependency
        run: python -m pip install 'Pillow>=10,<12'
      - name: Check private-seed schedule, no-image attack rejection, tamper rejection
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python research/observability/e002_603_private_challenge.py selftest
      - name: No private images or answer keys in Git checkout
        run: |
          test -z "$(git status --porcelain)"
          ! find research -type f \( -name 'truth.json' -o -name 'attack.json' -o -name '*.png' \) | grep .
