name: E002-602 public answer-key falsification
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - 'research/observability/e002_602_public_answer_attack.py'
      - 'research/observability/e002_600_phantom_rater_challenge.py'
      - 'research/observability/e002_600_independent_replay.cjs'
      - '.github/workflows/e002_602_public_answer_attack.yml'
  pull_request:
    paths:
      - 'research/observability/e002_602_public_answer_attack.py'
      - 'research/observability/e002_600_phantom_rater_challenge.py'
      - 'research/observability/e002_600_independent_replay.cjs'
      - '.github/workflows/e002_602_public_answer_attack.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-answer-attack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install synthetic image dependency
        run: python -m pip install 'Pillow>=10,<12'
      - name: Run precommitted no-image attack and independent oracle
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python research/observability/e002_602_public_answer_attack.py
      - name: Ensure no generated images or private labels persist in checkout
        run: |
          test -z "$(git status --porcelain)"
          ! find research -type f \( -name 'truth.json' -o -name 'attack.json' -o -name '*.png' \) | grep .
