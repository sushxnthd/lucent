name: instrument-ci

on:
  pull_request:
    paths:
      - 'instrument/**'
      - 'tests/test_instrument_protocol.py'
  push:
    branches: ['phone-observability-instrument']
    paths:
      - 'instrument/**'
      - 'tests/test_instrument_protocol.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON
        run: python -m json.tool instrument/protocol.json > /dev/null
      - name: Validate JavaScript syntax
        run: node --check instrument/app.js
      - name: Run protocol tests
        run: |
          python -m pip install pytest
          pytest -q tests/test_instrument_protocol.py