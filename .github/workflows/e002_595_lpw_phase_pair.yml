name: E002-595 authentic LPW phase-paired human-review instrument

on:
  push:
    branches:
      - research/observability-human-boundary
    paths:
      - research/observability/e002_595_lpw_phase_pair.py
      - research/observability/E002_595_FROZEN.md
      - .github/workflows/e002_595_lpw_phase_pair.yml
      - research/observability/e002_595_independent_replay.cjs
  pull_request:
    branches:
      - main
    paths:
      - research/observability/e002_595_lpw_phase_pair.py
      - research/observability/E002_595_FROZEN.md
      - .github/workflows/e002_595_lpw_phase_pair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-human-source-phase-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable branch revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native video decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Verify frozen phase grid and adversarial invalid inputs
        run: python3 research/observability/e002_595_lpw_phase_pair.py --self-test
      - name: Independent integer-only Node.js replay
        run: node research/observability/e002_595_independent_replay.cjs
      - name: Build and verify private human-source paired packets then destroy them
        run: python3 research/observability/e002_595_lpw_phase_pair.py
      - name: Confirm no private reviewer artifacts uploaded
        run: |
          test ! -d private_review_packets
          test ! -f source.avi
