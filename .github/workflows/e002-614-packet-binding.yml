name: E002-614 bound human-rater packet integrity
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - 'research/observability/E002_614_*'
      - 'research/observability/e002_614_*'
      - 'research/observability/test_e002_614_*'
      - 'research/observability/e002_598_offline_rater.html'
      - 'research/observability/e002_598_offline_rater_test.cjs'
      - '.github/workflows/e002-614-packet-binding.yml'
  pull_request:
    paths:
      - 'research/observability/E002_614_*'
      - 'research/observability/e002_614_*'
      - 'research/observability/test_e002_614_*'
      - 'research/observability/e002_598_offline_rater.html'
      - 'research/observability/e002_598_offline_rater_test.cjs'
      - '.github/workflows/e002-614-packet-binding.yml'
  workflow_dispatch:
jobs:
  packet-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install synthetic image generator only
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Python packet builder and independent audit tests
        run: |
          cd research/observability
          python -m unittest -v test_e002_614_packet_bind.py
      - name: Actual offline HTML adversarial browser VM
        run: node research/observability/e002_598_offline_rater_test.cjs
