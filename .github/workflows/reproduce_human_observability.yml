name: reproduce-human-observability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pspm-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Download PsPM-AOB_UW
        run: |
          curl -L --fail --retry 3 -o /tmp/pspm.zip 'https://zenodo.org/records/8239465/files/Data.zip?download=1'
          mkdir -p /tmp/pspm && unzip -q /tmp/pspm.zip -d /tmp/pspm
      - name: Reproduce frozen primary result
        run: |
          python experiments/pspm_human_prf.py --data-root /tmp/pspm/Data --output /tmp/APST5_HUMAN_PRF_001.md
          diff -u results/APST5_HUMAN_PRF_001.md /tmp/APST5_HUMAN_PRF_001.md

  pspm-directional-secondary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Download PsPM-AOB_UW
        run: |
          curl -L --fail --retry 3 -o /tmp/pspm.zip 'https://zenodo.org/records/8239465/files/Data.zip?download=1'
          mkdir -p /tmp/pspm && unzip -q /tmp/pspm.zip -d /tmp/pspm
      - name: Reproduce directional secondary result
        run: |
          python experiments/pspm_human_prf_directional.py --data-root /tmp/pspm/Data --output /tmp/APST5_HUMAN_PRF_001_SECONDARY.md
          diff -u results/APST5_HUMAN_PRF_001_SECONDARY.md /tmp/APST5_HUMAN_PRF_001_SECONDARY.md

  ehinger-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - name: Download Ehinger luminance table
        run: curl -L --fail --retry 3 -o /tmp/lum_binned.csv https://ndownloader.figshare.com/files/14184857
      - name: Reproduce independent result
        run: |
          python experiments/ehinger_human_prf.py --csv /tmp/lum_binned.csv --output /tmp/APST5_EHINGER_001.md
          diff -u results/APST5_EHINGER_001.md /tmp/APST5_EHINGER_001.md