name: pillai-js-endpoints

on:
  push:
    branches: ['pillai-drt-short-window']

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pillai-drt-short-window
      - name: Inspect browser API endpoints
        run: |
          python - <<'PY'
          import re, urllib.request
          from pathlib import Path

          url='https://data.mendeley.com/datasets/bundle.js?5e5376ee3a5def54f781'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=120) as response:
              text=response.read().decode('utf-8','replace')

          needles=['/api/datasets-v2','/public-api','filesLoading','content_details','download_url','downloadAll','versions/','/files']
          lines=['# Mendeley browser API endpoint inspection','',f'bundle bytes: **{len(text):,}**','']
          for needle in needles:
              lines += [f'## {needle}','']
              starts=[m.start() for m in re.finditer(re.escape(needle),text,flags=re.I)]
              lines.append(f'matches: **{len(starts)}**')
              lines.append('')
              for idx in starts[:40]:
                  snippet=text[max(0,idx-800):idx+1600]
                  snippet=snippet.replace('\n',' ')
                  lines.append('~~~text')
                  lines.append(snippet)
                  lines.append('~~~')
                  lines.append('')

          # Also extract literal paths mentioning datasets/files.
          literals=set(re.findall(r'[\"\']([^\"\']{0,160}(?:datasets|files|versions)[^\"\']{0,160})[\"\']',text,re.I))
          lines += ['## candidate string literals','']
          for item in sorted(literals)[:1000]:
              if '/' in item:
                  lines.append(f'- {item}')

          Path('results/PILLAI_JS_ENDPOINTS.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:500]))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/PILLAI_JS_ENDPOINTS.md
          git commit -m "Inspect Mendeley browser API endpoints [skip ci]" || exit 0
          git push origin HEAD:pillai-drt-short-window