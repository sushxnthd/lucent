name: temporal-alignment-experiment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  target-smoothing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temporal-alignment-breakthrough

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run preregistered target-smoothing experiment
        run: python experiments/mts_target_smoothing.py

      - name: Commit frozen result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/MTS_TARGET_SMOOTHING_001.md
          git commit -m "MTS-TARGET-SMOOTHING-001: frozen temporal-alignment result [skip ci]" || exit 0
          git push origin HEAD:temporal-alignment-breakthrough