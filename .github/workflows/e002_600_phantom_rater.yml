name: E002-600 blinded synthetic rater calibration instrument
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - 'research/observability/e002_600_*'
      - 'research/observability/test_e002_600_*'
      - 'research/observability/E002_600_*'
      - '.github/workflows/e002_600_phantom_rater.yml'
  pull_request:
    paths:
      - 'research/observability/e002_600_*'
      - 'research/observability/test_e002_600_*'
      - 'research/observability/E002_600_*'
      - '.github/workflows/e002_600_phantom_rater.yml'
  workflow_dispatch:
jobs:
  synthetic-reviewer-instrument:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install synthetic-image generator dependency
        run: python -m pip install 'Pillow>=10,<12'
      - name: Deterministic synthetic generation, independent score replay and negative controls
        run: cd research/observability && python -m unittest -v test_e002_600_phantom_rater_challenge.py
      - name: Ensure no synthetic PNGs, private truths or reviewer ratings were committed
        run: |
          if git ls-files | grep -E '(^|/)(private|reviewer)/|E002_600_.*RATINGS|[.]png$' | grep -E 'E002_600|research/observability/(private|reviewer)/'; then
            echo "Private reviewer artifact tracked"; exit 1
          fi
          git status --porcelain
