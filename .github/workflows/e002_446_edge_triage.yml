name: E002-446 S19 edge-span identifiability triage
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - '.github/workflows/e002_446_edge_triage.yml'
      - 'research/observability/e002_446_edge_triage.py'
      - 'research/observability/test_e002_446_edge_triage.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edge-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric dependency and decoder
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Independent synthetic adversarial tests
        run: PYTHONPATH=research/observability python -m unittest discover -s research/observability -p 'test_e002_446_edge_triage.py' -v
      - name: Hash-verify S19 and run frozen 3000-frame edge-span triage
        id: human
        continue-on-error: true
        run: python research/observability/e002_446_edge_triage.py --output /tmp/e002_446_s19_aggregate.json
      - name: Publish aggregate only and preserve release block
        if: always()
        run: |
          if [ -f /tmp/e002_446_s19_aggregate.json ]; then
            cat /tmp/e002_446_s19_aggregate.json
          else
            echo '{"experiment":"E002-446","status":"HUMAN_ANALYSIS_FAILED","physical_release_authorized":false,"product_claim":"ABSTAIN_UNCALIBRATED"}' > /tmp/e002_446_s19_aggregate.json
          fi
          echo 'Image-edge spans are not anatomical eyelid boundaries. No physical release authorized.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e002-446-s19-edge-triage-aggregate
          path: /tmp/e002_446_s19_aggregate.json
          retention-days: 14
      - name: Fail if human experiment failed
        if: steps.human.outcome != 'success'
        run: exit 1
