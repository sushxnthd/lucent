name: Lucent E002-174 provenance gate
on:
  push:
    branches:
      - 'research/e002-174-prior-art-eligibility'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/e002-174/eligibility.py
      - run: python research/e002-174/independent_check.py
