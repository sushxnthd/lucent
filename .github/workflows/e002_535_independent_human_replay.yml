name: E002-535 independent frozen human-null replay
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - 'research/observability/E002_535_*'
      - 'research/observability/e002_535_*'
      - 'research/observability/test_e002_535_*'
      - '.github/workflows/e002_535_independent_human_replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed software dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Run twelve independent adversarial controls and FFV1 roundtrip
        run: |
          python -m py_compile research/observability/e002_535_independent_human_replay.py
          cd research/observability
          python -m unittest -v test_e002_535_independent_human_replay.py
  human-source-replay:
    needs: independent-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        participant: [S01, S19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies; FFmpeg CLI is a separate decoder entry point
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Download and hash-check authentic source privately
        env:
          PARTICIPANT: ${{ matrix.participant }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lucent-e002-535
          if [ "$PARTICIPANT" = "S01" ]; then
            URL='https://zenodo.org/records/18978288/files/S01.zip?download=1'
            MD5='fef02cb7ebf62e4f3efb6303284fd6cb'
          else
            URL='https://zenodo.org/records/21905748/files/S19.zip?download=1'
            MD5='8a16cf12526f7558b4e49926c4bc5e8e'
          fi
          curl --fail --location --retry 2 --retry-delay 8 --connect-timeout 45 --max-time 1400 \
            "$URL" --output "/tmp/lucent-e002-535/$PARTICIPANT.zip"
          echo "$MD5  /tmp/lucent-e002-535/$PARTICIPANT.zip" | md5sum --check
      - name: Replay frozen human-image negative result without OpenCV decoding
        env:
          PARTICIPANT: ${{ matrix.participant }}
        run: |
          set -euo pipefail
          trap 'rm -rf /tmp/lucent-e002-535' EXIT
          python research/observability/e002_535_independent_human_replay.py \
            --archive "/tmp/lucent-e002-535/$PARTICIPANT.zip" \
            --participant "$PARTICIPANT"
          echo 'Aggregate-only software replay; no human images or per-window scores uploaded.'
