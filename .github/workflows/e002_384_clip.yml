name: E002-384 clip-calibration independent reproduction
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - 'research/observability/e002_384_*'
      - 'research/observability/E002_384_*'
      - '.github/workflows/e002_384_clip.yml'
  workflow_dispatch:
jobs:
  synthetic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2.0'
      - name: Reproduce held-out synthetic instrument
        working-directory: research/observability
        run: python e002_384_clip_calibration.py --output .
      - name: Independent exact checker
        working-directory: research/observability
        run: python e002_384_independent_checker.py
      - name: Verify frozen numerical outcomes and fail-closed product gate
        working-directory: research/observability
        run: |
          python - <<'PY'
          import json
          x=json.load(open('e002_384_results.json'))
          assert x['in_domain']['frame99']['fully_covered_clips']==736
          assert x['in_domain']['clip95']['fully_covered_clips']==952
          assert x['unseen_camera']['frame99']['fully_covered_clips']==23
          assert x['unseen_camera']['clip95']['fully_covered_clips']==966
          for d in ('in_domain','unseen_camera'):
              for q in ('frame99','clip95'):
                  assert x[d][q]['gated_certified_gaps']==0
                  assert x[d][q]['naive_false_certified_gaps']==0
          print('E002-384 frozen predictions, negative outcomes and abstention verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e002-384-synthetic-evidence
          path: |
            research/observability/e002_384_results.json
            research/observability/e002_384_independent_results.json
            research/observability/e002_384_audit_sample.npz
