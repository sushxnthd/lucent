name: E002-557 browser-real blinded-rater validation
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - '.github/workflows/e002_557_browser_e2e.yml'
      - 'research/observability/e002_557_browser_e2e.py'
      - 'research/observability/e002_497_offline_rater.html'
      - 'research/observability/e002_555_offline_rater.html'
      - 'research/observability/e002_492_anatomical_review.py'
      - 'research/observability/e002_555_rater_audit.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lucent-e002-557-browser
  cancel-in-progress: false
jobs:
  synthetic-browser-e2e:
    if: github.repository == 'sushxnthd/lucent'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only browser-test dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.56.0 pillow==12.0.0
      - name: Check Chromium and FFmpeg availability
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -hide_banner -encoders | grep -E 'libx264'
      - name: Exercise native-frame and video raters in real browser
        shell: bash
        run: |
          set -euo pipefail
          python research/observability/e002_557_browser_e2e.py
      - name: Preserve no synthetic or human image artifacts
        run: echo 'All synthetic frames, videos and exported annotations were confined to ephemeral temporary directories.'
