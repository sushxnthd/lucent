name: inspect-screen-plr-supplements

on:
  push:
    branches: ['screen-plr-fatigue-reanalysis']

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screen-plr-fatigue-reanalysis

      - name: Download BioStudies supplements
        run: |
          mkdir -p /tmp/plr
          for f in pone.0197739.s001.docx pone.0197739.s002.docx pone.0197739.s003.tif; do
            curl -L --fail --retry 3 -o /tmp/plr/$f https://www.ebi.ac.uk/biostudies/files/S-EPMC5999086/$f
          done

      - name: Extract DOCX text and tables
        run: |
          python -m pip install python-docx
          python - <<'PY'
          from pathlib import Path
          from docx import Document

          lines=['# Screen-PLR supplements inspection','']
          for name in ['pone.0197739.s001.docx','pone.0197739.s002.docx']:
              path=Path('/tmp/plr')/name
              lines.append(f'## {name}')
              lines.append('')
              doc=Document(path)
              lines.append('### Paragraphs')
              lines.append('')
              for p in doc.paragraphs:
                  text=p.text.strip()
                  if text:
                      lines.append(text)
              lines.append('')
              lines.append(f'### Tables ({len(doc.tables)})')
              lines.append('')
              for ti,table in enumerate(doc.tables):
                  lines.append(f'#### Table {ti+1}')
                  lines.append('')
                  for row in table.rows:
                      cells=[c.text.replace('\n',' / ').strip() for c in row.cells]
                      lines.append(' | '.join(cells))
                  lines.append('')

          out=Path('results/SCREEN_PLR_SUPPLEMENTS.md')
          out.write_text('\n'.join(lines), encoding='utf-8')
          print('\n'.join(lines[:1800]))
          PY

      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/SCREEN_PLR_SUPPLEMENTS.md
          git commit -m 'Inspect screen-PLR fatigue supplements [skip ci]' || exit 0
          git push origin HEAD:screen-plr-fatigue-reanalysis