name: rgb-scale-observability-audit

on:
  pull_request:
    paths:
      - "experiments/rgb_scale_observability_audit.py"
      - "results/RGB_SCALE_OBSERVABILITY_001.md"
      - ".github/workflows/rgb-scale-observability.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run frozen RGB scale audit
        run: |
          python experiments/rgb_scale_observability_audit.py \
            --json-out /tmp/rgb_scale_observability.json
          python - <<'PY'
          import json
          p="/tmp/rgb_scale_observability.json"
          d=json.load(open(p))
          assert d["n_clips"] == 8
          assert d["leave_one_clip_out_power_law_correction"]["n_eye_clip_holdouts"] == 16
          print("audit complete")
          PY
