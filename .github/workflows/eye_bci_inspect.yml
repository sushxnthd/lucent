name: eye-bci-inspect

on:
  push:
    branches: ['eye-bci-extractor-validation']

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eye-bci-extractor-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install remote zip tools
        run: python -m pip install requests remotezip pandas openpyxl
      - name: Inspect Zenodo S01 archive without full download
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          from remotezip import RemoteZip

          record_id='18970793'
          meta=requests.get(f'https://zenodo.org/api/records/{record_id}',timeout=60).json()
          files=meta.get('files',[])
          target=next((f for f in files if f.get('key')=='S01.zip'),None)
          if not target:
              raise RuntimeError('S01.zip not found in Zenodo record')
          url=(target.get('links') or {}).get('self') or (target.get('links') or {}).get('content')
          if not url:
              raise RuntimeError('No download URL for S01.zip')

          lines=['# Eye-BCI S01 remote ZIP manifest','',f'Record: {record_id}',f'Archive bytes: {target.get("size")}',f'Download: {url}','']
          with RemoteZip(url) as z:
              infos=z.infolist()
              lines.append(f'Entries: **{len(infos)}**')
              lines.append('')
              lines.append('## File type counts')
              counts={}
              for info in infos:
                  name=info.filename.lower()
                  suffix='.'+name.rsplit('.',1)[-1] if '.' in name else '<none>'
                  counts[suffix]=counts.get(suffix,0)+1
              lines.append('| suffix | count |')
              lines.append('| --- | ---: |')
              for suffix,count in sorted(counts.items(), key=lambda kv:(-kv[1],kv[0])):
                  lines.append(f'| {suffix} | {count} |')
              lines.append('')
              lines.append('## Paths')
              lines.append('')
              for info in infos[:500]:
                  lines.append(f'- {info.filename} ({info.file_size:,} bytes)')

          Path('results/EYE_BCI_S01_MANIFEST.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:240]))
          PY
      - name: Inspect synchronization and Tobii schemas
        run: |
          python - <<'PY'
          import io, json
          from pathlib import Path
          import pandas as pd
          import requests
          from remotezip import RemoteZip

          record_id='18970793'
          meta=requests.get(f'https://zenodo.org/api/records/{record_id}',timeout=60).json()
          target=next(f for f in meta['files'] if f['key']=='S01.zip')
          url=target['links'].get('self') or target['links'].get('content')

          lines=['# Eye-BCI S01 schema inspection','']
          with RemoteZip(url) as z:
              for name in [
                  'Sess01/MI011_sync.csv',
                  'Sess01/MI011_tobii.csv',
                  'Sess01/MI011_annotations.json',
                  'Sess01/S01_Sess01.xlsx',
              ]:
                  lines.append(f'## {name}')
                  lines.append('')
                  raw=z.read(name)
                  lines.append(f'bytes: {len(raw):,}')
                  lines.append('')
                  if name.endswith('.csv'):
                      df=pd.read_csv(io.BytesIO(raw), nrows=8)
                      lines.append('columns:')
                      for col in df.columns:
                          lines.append(f'- {col}')
                      lines.append('')
                      lines.append('first rows:')
                      lines.append('')
                      lines.append('    '+df.head(5).to_csv(index=False).replace('\n','\n    '))
                  elif name.endswith('.json'):
                      obj=json.loads(raw.decode('utf-8'))
                      preview=json.dumps(obj,indent=2)[:12000]
                      lines.append('~~~json')
                      lines.append(preview)
                      lines.append('~~~')
                  elif name.endswith('.xlsx'):
                      df=pd.read_excel(io.BytesIO(raw))
                      lines.append('columns:')
                      for col in df.columns:
                          lines.append(f'- {col}')
                      lines.append('')
                      lines.append('    '+df.head(10).to_csv(index=False).replace('\n','\n    '))

          Path('results/EYE_BCI_S01_SCHEMA.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:260]))
          PY

      - name: Analyze Phantom-Tobii alignment
        run: |
          python - <<'PY'
          import io
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import requests
          from remotezip import RemoteZip

          meta=requests.get('https://zenodo.org/api/records/18970793',timeout=60).json()
          target=next(f for f in meta['files'] if f['key']=='S01.zip')
          url=target['links'].get('self') or target['links'].get('content')

          with RemoteZip(url) as z:
              sync=pd.read_csv(io.BytesIO(z.read('Sess01/MI011_sync.csv')))
              tobii=pd.read_csv(io.BytesIO(z.read('Sess01/MI011_tobii.csv')), low_memory=False)

          lines=['# Eye-BCI Phantom/Tobii alignment audit','']

          ph=sync.dropna(subset=['PhanFrame']).copy()
          lines += [
              '## Phantom mapping',
              '',
              f'sync rows: **{len(sync):,}**',
              f'rows with PhanFrame: **{len(ph):,}**',
              f'PhanFrame range: **{ph.PhanFrame.min()} .. {ph.PhanFrame.max()}**',
              f'Time range at mapped frames: **{ph.Time.min():.6f} .. {ph.Time.max():.6f} s**',
              '',
          ]

          for col in ['PhanFrame','PhanTime','RelTime','RecordingTimestamp','LocalTimeStamp']:
              if col in ph:
                  vals=pd.to_numeric(ph[col],errors='coerce')
                  lines.append(f'- {col}: finite={vals.notna().sum():,}, min={vals.min()}, max={vals.max()}')

          lines += ['', 'first mapped rows:', '']
          lines.append('    '+ph[['Time','PhanFrame','PhanTime','RelTime','RecordingTimestamp','LocalTimeStamp']].head(12).to_csv(index=False).replace('\n','\n    '))

          for col in ['RecordingTimestamp','PupilLeft','PupilRight','ValidityLeft','ValidityRight','CamLeftX','CamLeftY','CamRightX','CamRightY']:
              if col in tobii:
                  tobii[col]=pd.to_numeric(tobii[col],errors='coerce')

          pupil=tobii[(tobii.PupilLeft.notna() | tobii.PupilRight.notna())].copy()
          lines += [
              '',
              '## Tobii pupil stream',
              '',
              f'Tobii rows: **{len(tobii):,}**',
              f'rows with pupil: **{len(pupil):,}**',
              f'RecordingTimestamp range: **{pupil.RecordingTimestamp.min()} .. {pupil.RecordingTimestamp.max()} ms**',
              f'PupilLeft range: **{pupil.PupilLeft.min()} .. {pupil.PupilLeft.max()}**',
              f'PupilRight range: **{pupil.PupilRight.min()} .. {pupil.PupilRight.max()}**',
              '',
              'first valid pupil rows:',
              '',
              '    '+pupil[['RecordingTimestamp','LocalTimeStamp','PupilLeft','PupilRight','ValidityLeft','ValidityRight','CamLeftX','CamLeftY','CamRightX','CamRightY']].head(12).to_csv(index=False).replace('\n','\n    '),
          ]

          # Is sync RecordingTimestamp in the same millisecond domain as Tobii?
          ph_rt=pd.to_numeric(ph['RecordingTimestamp'],errors='coerce').dropna().to_numpy()
          tob_rt=pd.to_numeric(pupil['RecordingTimestamp'],errors='coerce').dropna().to_numpy()
          lines += ['', '## Timestamp compatibility', '']
          if len(ph_rt) and len(tob_rt):
              overlap_lo=max(float(np.min(ph_rt)),float(np.min(tob_rt)))
              overlap_hi=min(float(np.max(ph_rt)),float(np.max(tob_rt)))
              lines.append(f'raw RecordingTimestamp overlap: **{overlap_lo} .. {overlap_hi}**')
              lines.append(f'overlap exists: **{overlap_hi >= overlap_lo}**')
              if len(tob_rt)>1:
                  dt=np.diff(np.sort(np.unique(tob_rt)))
                  dt=dt[(dt>0)&np.isfinite(dt)]
                  if len(dt):
                      lines.append(f'Tobii median timestamp step: **{np.median(dt):.3f}**')
          else:
              lines.append('No finite shared RecordingTimestamp fields found.')

          Path('results/EYE_BCI_ALIGNMENT.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:220]))
          PY

      - name: Commit manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/EYE_BCI_S01_MANIFEST.md results/EYE_BCI_S01_SCHEMA.md results/EYE_BCI_ALIGNMENT.md
          git commit -m "Inspect Eye-BCI S01 remote archive [skip ci]" || exit 0
          git push origin HEAD:eye-bci-extractor-validation