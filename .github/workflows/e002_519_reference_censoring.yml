name: E002-519 reference-censoring witness gate
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - 'research/observability/e002_519_reference_censoring.py'
      - 'research/observability/test_e002_519_reference_censoring.py'
      - '.github/workflows/e002_519_reference_censoring.yml'
      - 'research/observability/e002_520_cross_camera.py'
      - 'research/observability/test_e002_520_cross_camera.py'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s research/observability -p 'test_e002_519_reference_censoring.py' -v
      - run: python -m unittest discover -s research/observability -p 'test_e002_520_cross_camera.py' -v
