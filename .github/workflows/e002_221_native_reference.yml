name: E002-221 native reference admission
on:
  push:
    branches:
      - research/e002-221-eott-native-reference-admission
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python3 research/e002-220/extract.py
      - run: python3 research/e002-221/analyze.py
      - run: python3 research/e002-221/valid_only.py
      - run: python3 research/e002-221/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e002-221-native-reference-admission
          path: |
            research/e002-221/*.json
            research/e002-220/MEMBER_HASHES.json
