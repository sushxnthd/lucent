name: E002-386 synthetic selective-risk validation
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - "research/observability/e002_386_*"
      - ".github/workflows/e002_386_selective_risk.yml"
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Independent mathematical and product-gate checker
        run: python research/observability/e002_386_independent_checker.py
      - name: Reproduce preregistered synthetic experiment
        run: |
          python research/observability/e002_386_selective_calibration.py --out /tmp/e002_386_reproduction.json
          python - <<'PY'
          import json
          from pathlib import Path
          frozen=json.loads(Path('research/observability/e002_386_results.json').read_text())
          reproduced=json.loads(Path('/tmp/e002_386_reproduction.json').read_text())
          assert frozen==reproduced, 'E002-386 result changed: preregistered reproduction mismatch'
          assert reproduced['iid']['selected']['risk']<=.02
          assert reproduced['unseen_device_if_gate_bypassed']['selected']['risk']>.02
          assert reproduced['product_gates']['synthetic_only']=='ABSTAIN_NO_HUMAN_VALIDATION'
          print('E002-386 exact deterministic reproduction PASS')
          PY
