name: inspect-webcam-eye-data

on:
  push:
    branches: ['webcam-observability-bridge']

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: webcam-observability-bridge

      - name: Inspect OSF public file tree
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path

          root='https://api.osf.io/v2/nodes/qh8kx/files/'
          req=urllib.request.Request(root,headers={'User-Agent':'lucent-research/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              providers=json.load(r)

          lines=['# Saxena webcam eye-tracking public-data manifest','']

          def walk(url,depth=0,maxdepth=5):
              while url:
                  req=urllib.request.Request(url,headers={'User-Agent':'lucent-research/1.0'})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      data=json.load(r)
                  for item in data.get('data',[]):
                      attr=item.get('attributes',{})
                      name=attr.get('name')
                      kind=attr.get('kind')
                      size=attr.get('size')
                      path=attr.get('materialized_path')
                      links=item.get('links',{})
                      lines.append(f"{'  '*depth}- {kind}: {path or name} size={size} download={links.get('download')}")
                      if kind=='folder' and depth<maxdepth:
                          rel=item.get('relationships',{}).get('files',{}).get('links',{}).get('related',{}).get('href')
                          if rel:
                              walk(rel,depth+1,maxdepth)
                  nxt=data.get('links',{}).get('next')
                  url=nxt

          for provider in providers.get('data',[]):
              lines.append(f"## Provider: {provider.get('attributes',{}).get('name')}")
              lines.append('')
              rel=provider.get('relationships',{}).get('files',{}).get('links',{}).get('related',{}).get('href')
              if rel: walk(rel)
              lines.append('')

          Path('results/WEBCAM_DATA_MANIFEST.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:2000]))
          PY

      - name: Commit manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/WEBCAM_DATA_MANIFEST.md
          git commit -m 'Inspect public webcam eye-tracking recordings [skip ci]' || exit 0
          git push origin HEAD:webcam-observability-bridge