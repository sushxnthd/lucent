name: ehinger-device-transfer

on:
  push:
    branches: ['pspm-luminance-calibration']
    paths:
      - 'experiments/ehinger_device_transfer.py'
      - 'experiments/registrations/EHINGER_DEVICE_TRANSFER_001.md'
      - '.github/workflows/ehinger_device_transfer.yml'

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pspm-luminance-calibration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install numpy pandas
      - name: Download public preprocessed luminance data
        run: curl -L --fail --retry 3 -o /tmp/lum_binned.csv https://ndownloader.figshare.com/files/14184857
      - name: Run frozen device-transfer analysis
        run: python experiments/ehinger_device_transfer.py /tmp/lum_binned.csv --output results/EHINGER_DEVICE_TRANSFER_001.md
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/EHINGER_DEVICE_TRANSFER_001.md
          git commit -m 'EHINGER-DEVICE-TRANSFER-001: frozen cross-device result [skip ci]' || exit 0
          git pull --rebase origin pspm-luminance-calibration
          git push origin HEAD:pspm-luminance-calibration