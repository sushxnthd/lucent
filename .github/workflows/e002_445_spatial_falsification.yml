name: E002-445 S19 spatial nuisance falsification
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - '.github/workflows/e002_445_spatial_falsification.yml'
      - 'research/observability/e002_445_spatial_falsification.py'
      - 'research/observability/test_e002_445_spatial_falsification.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spatial-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric dependency and decoder
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Independent synthetic adversarial tests
        run: PYTHONPATH=research/observability python -m unittest discover -s research/observability -p 'test_e002_445_spatial_falsification.py' -v
      - name: Hash-verify S19 and run frozen 12000-frame nuisance experiment
        id: human
        continue-on-error: true
        run: python research/observability/e002_445_spatial_falsification.py --output /tmp/e002_445_s19_aggregate.json
      - name: Print aggregate and explicitly preserve release block
        if: always()
        run: |
          if [ -f /tmp/e002_445_s19_aggregate.json ]; then
            cat /tmp/e002_445_s19_aggregate.json
          else
            echo '{"experiment":"E002-445","status":"HUMAN_ANALYSIS_FAILED","physical_release_authorized":false,"product_claim":"ABSTAIN_UNCALIBRATED"}' > /tmp/e002_445_s19_aggregate.json
          fi
          echo 'S19 optical association is not anatomical eyelid aperture or authenticated shutter timing. No physical release authorized.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e002-445-s19-spatial-aggregate
          path: /tmp/e002_445_s19_aggregate.json
          retention-days: 14
      - name: Fail if actual human experiment failed
        if: steps.human.outcome != 'success'
        run: exit 1
