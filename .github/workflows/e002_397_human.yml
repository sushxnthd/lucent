name: E002-397 frozen human motion-proxy falsification
on:
  push:
    branches: [research/observability-human-boundary]
    paths:
      - "research/observability/E002_397_FROZEN.md"
      - "research/observability/e002_397_human_motion.py"
      - "research/observability/e002_397_independent_check.py"
      - ".github/workflows/e002_397_human.yml"
  workflow_dispatch:
jobs:
  two-participant-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        participant: [S01, S19]
    steps:
      - uses: actions/checkout@v4
      - name: Install reproducible open-source dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Acquire previously verified human video and verify checksum
        env:
          PARTICIPANT: ${{ matrix.participant }}
        run: |
          mkdir -p /tmp/lucent-e002-397
          if [ "$PARTICIPANT" = "S01" ]; then
            URL='https://zenodo.org/records/18978288/files/S01.zip?download=1'
            MD5='fef02cb7ebf62e4f3efb6303284fd6cb'
          else
            URL='https://zenodo.org/records/21905748/files/S19.zip?download=1'
            MD5='8a16cf12526f7558b4e49926c4bc5e8e'
          fi
          curl --fail --location --retry 2 --retry-delay 8 --connect-timeout 45 --max-time 1400 \
            "$URL" --output "/tmp/lucent-e002-397/$PARTICIPANT.zip"
          echo "$MD5  /tmp/lucent-e002-397/$PARTICIPANT.zip" | md5sum --check
      - name: Execute frozen motion-proxy test
        env:
          PARTICIPANT: ${{ matrix.participant }}
        run: |
          python research/observability/e002_397_human_motion.py \
            --archive "/tmp/lucent-e002-397/$PARTICIPANT.zip" \
            --participant "$PARTICIPANT" \
            --output "/tmp/lucent-e002-397/$PARTICIPANT-results"
      - name: Independent rank-statistic and decision oracle
        env:
          PARTICIPANT: ${{ matrix.participant }}
        run: |
          python research/observability/e002_397_independent_check.py \
            --output "/tmp/lucent-e002-397/$PARTICIPANT-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e002-397-${{ matrix.participant }}-anonymous-motion
          path: /tmp/lucent-e002-397/${{ matrix.participant }}-results/
          retention-days: 14
