name: Lucent alpha regression
on:
  push:
    branches:
      - research/observability-human-boundary
  pull_request:
    paths:
      - 'alpha/**'
      - '.github/workflows/lucent-alpha-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reaction-time:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic browser-script behavioral regression
        run: node alpha/test-reaction-time-demo.cjs
