name: inspect-ehinger-luminance-data

on:
  push:
    branches: ['ehinger-prf-replication']

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ehinger-prf-replication

      - name: Inspect Figshare collection
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path

          urls=[
            'https://api.figshare.com/v2/collections/4379810/articles?page_size=100',
            'https://api.figshare.com/v2/collections/4379810',
          ]
          lines=['# Ehinger 2019 Figshare collection manifest','']
          article_ids=[]
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'lucent-research/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  data=json.load(r)
              lines.append(f'## {url}')
              lines.append('')
              lines.append('~~~json')
              lines.append(json.dumps(data,indent=2)[:50000])
              lines.append('~~~')
              if isinstance(data,list):
                  article_ids.extend([item.get('id') for item in data if item.get('id')])

          lines.append('')
          lines.append('## Article files')
          lines.append('')
          for aid in article_ids:
              req=urllib.request.Request(f'https://api.figshare.com/v2/articles/{aid}',headers={'User-Agent':'lucent-research/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  article=json.load(r)
              lines.append(f'### {aid}: {article.get("title")}')
              lines.append('')
              for f in article.get('files',[]):
                  lines.append(f'- {f.get("name")} ({f.get("size")} bytes) id={f.get("id")} download={f.get("download_url")}')
              lines.append('')

          Path('results/EHINGER_FIGSHARE_MANIFEST.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:2500]))
          PY

      - name: Commit manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/EHINGER_FIGSHARE_MANIFEST.md
          git commit -m 'Inspect Ehinger luminance benchmark data [skip ci]' || exit 0
          git push origin HEAD:ehinger-prf-replication