name: E002-376 shutter phase coverage
on:
  push:
    branches:
      - research/observability-human-boundary
  workflow_dispatch:
jobs:
  phase-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exact rational shutter phase law
        run: python research/observability/e002_376_checker.py
      - name: Check camera-qualification abstention behavior
        run: python research/observability/test_certificate.py
