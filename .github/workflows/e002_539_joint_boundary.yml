name: E002-539 joint derivative observability boundary
on:
  push:
    branches:
      - research/observability-human-boundary
    paths:
      - 'research/observability/E002_539_*'
      - 'research/observability/e002_539_*'
      - 'research/observability/test_e002_539_*'
      - '.github/workflows/e002_539_joint_boundary.yml'
  workflow_dispatch:

jobs:
  independent-mixed-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install independent LP optimizer
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Exact frozen rational cases
        run: python research/observability/e002_539_joint_boundary.py --frozen
      - name: Adversarial exact-math and evidence-gate tests
        run: python -m unittest discover -s research/observability -p 'test_e002_539_joint_boundary.py' -v
      - name: Independently discretized adversarial LP
        run: python research/observability/e002_539_lp_adversary.py
      - name: Independent Node BigInt rational replay
        run: node research/observability/e002_539_independent_replay.cjs
